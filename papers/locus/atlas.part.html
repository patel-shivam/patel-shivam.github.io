<style>
.at {
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: var(--surface);
  padding: 1.1rem 1.2rem 1.2rem;
  margin: 2rem 0;
}
.at h4 {
  font-family: var(--sans);
  font-size: .72rem; font-weight: 650; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted);
  margin: 0 0 .85rem;
}

/* mode tabs */
.at-tabs { display: flex; gap: .3rem; margin-bottom: .9rem; flex-wrap: wrap; }
.at-tabs button {
  font: inherit; font-size: .78rem;
  padding: .3rem .7rem; border-radius: 5px;
  border: 1px solid var(--rule); background: var(--bg); color: var(--fg-soft);
  cursor: pointer; transition: border-color .15s, color .15s, background .15s;
}
.at-tabs button:hover { border-color: var(--accent); color: var(--accent); }
.at-tabs button[aria-pressed="true"] {
  background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600;
}
.at-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.at-grid { display: grid; grid-template-columns: 1.16fr 1fr; gap: 1.3rem; align-items: start; }
@media (max-width: 760px) { .at-grid { grid-template-columns: 1fr; } }

/* map */
.at-map { width: 100%; height: auto; display: block; touch-action: manipulation; cursor: crosshair; }
.at-map .pt { stroke: var(--bg); stroke-width: .8; transition: opacity .12s; }
.at-map .pt.dim { opacity: .34; }
.at-map .sel { stroke: var(--fg); stroke-width: 1.6; }
.at-map .hot { stroke: var(--fg); stroke-width: 1.8; }
.at-map .link { stroke-linecap: round; fill: none; }
.at-map .cover { stroke: var(--muted); stroke-width: .5; opacity: .3; }
.at-map .ring { fill: none; stroke: var(--fg); stroke-dasharray: 3 3; opacity: .4; }
.at-map text.lbl {
  font-family: var(--sans); font-size: 7.5px; fill: var(--fg-soft);
  paint-order: stroke; stroke: var(--bg); stroke-width: 2.4px; stroke-linejoin: round;
}

.at-legend {
  display: flex; flex-wrap: wrap; gap: .3rem .8rem;
  margin-top: .5rem; font-size: .7rem; color: var(--muted);
}
.at-legend span { display: inline-flex; align-items: center; gap: .28rem; }
.at-legend i { width: .5rem; height: .5rem; border-radius: 50%; display: inline-block; }

/* side panel */
.at-sub {
  font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 .5rem; font-weight: 650;
}
.at-sub.second { margin-top: 1.15rem; }
.at-name {
  font-size: .92rem; font-weight: 650; color: var(--fg);
  margin: 0 0 .1rem; line-height: 1.35; word-break: break-word;
}
.at-name .org { color: var(--muted); font-weight: 400; }
.at-meta { font-size: .75rem; color: var(--muted); margin: 0 0 .8rem; }
.at-meta .tag {
  display: inline-block; padding: .04rem .34rem; border-radius: 3px;
  background: var(--badge-bg); color: var(--fg-soft); margin-right: .3rem; font-size: .92em;
}

/* profile bars */
.at-prof { font-size: .72rem; }
.at-prow { display: grid; grid-template-columns: 4.6rem 1fr 2.1rem; gap: .4rem; align-items: center; margin-bottom: .2rem; }
.at-prow .nm { color: var(--muted); }
.at-prow .tr { height: 6px; border-radius: 3px; background: var(--badge-bg); overflow: hidden; }
.at-prow .fl { height: 100%; border-radius: 3px; }
.at-prow .pc { text-align: right; color: var(--fg-soft); font-variant-numeric: tabular-nums; }

/* neighbour list */
.at-nb { font-size: .78rem; }
.at-nb ol { margin: 0; padding: 0; list-style: none; counter-reset: nb; }
.at-nb li {
  display: grid; grid-template-columns: 1rem 1fr auto; gap: .45rem;
  padding: .26rem 0; border-bottom: 1px solid var(--rule); align-items: baseline;
}
.at-nb li:last-child { border-bottom: none; }
.at-nb li::before {
  counter-increment: nb; content: counter(nb);
  color: var(--muted); font-size: .72rem; font-variant-numeric: tabular-nums;
}
.at-nb .who { color: var(--fg-soft); word-break: break-word; line-height: 1.35; }
.at-nb .ag { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.at-nb .ag small { color: var(--muted); font-weight: 400; display: block; font-size: .8em; text-align: right; }

/* portfolio bars */
.at-bars { font-size: .8rem; margin-top: .2rem; }
.at-brow { margin-bottom: .5rem; }
.at-brow .lab { display: flex; justify-content: space-between; margin-bottom: .16rem; color: var(--fg-soft); }
.at-brow .lab .v { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .92em; }
.at-btrack { height: 8px; border-radius: 4px; background: var(--badge-bg); overflow: hidden; position: relative; }
.at-bfill { height: 100%; border-radius: 4px; transition: width .15s ease; }
.at-full {
  position: absolute; top: -2px; bottom: -2px; width: 0;
  border-right: 2px dashed var(--fg); opacity: .55;
}

.at-picks { font-size: .75rem; color: var(--fg-soft); line-height: 1.55; margin: .2rem 0 0; }
.at-picks li { margin-bottom: .12rem; word-break: break-word; }

/* controls */
.at-controls { margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--rule); }
.at-slider { display: flex; align-items: center; gap: .7rem; font-size: .82rem; color: var(--fg-soft); }
.at-slider input { flex: 1; accent-color: var(--accent); }
.at-slider .val { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 2.4rem; text-align: right; font-size: .78rem; }
.at-row { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .7rem; align-items: center; }
.at-row .cap { font-size: .75rem; color: var(--muted); margin-right: .1rem; }
.at-row button {
  font: inherit; font-size: .75rem;
  padding: .2rem .55rem; border-radius: 5px;
  border: 1px solid var(--rule); background: var(--bg); color: var(--fg-soft); cursor: pointer;
}
.at-row button:hover { border-color: var(--accent); color: var(--accent); }
.at-row button[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.at-row button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.at-note { font-size: .8rem; color: var(--muted); margin: .85rem 0 0; line-height: 1.6; }
.at-note b { color: var(--fg-soft); font-weight: 600; }
.at-src {
  font-size: .72rem; color: var(--muted); margin: .85rem 0 0;
  padding-top: .7rem; border-top: 1px solid var(--rule); line-height: 1.55;
}
.at-hide { display: none !important; }
</style>

    }
    if (colBy === 'spec') {
      ['math', 'code', 'biomed', 'science', 'safety', 'roleplay'].forEach(function (k) { item(SPEC[k], k); });
      item(css('--muted') || '#74787f', 'general');
    } else if (colBy === 'acc') {
      item('#c9ccd1', accRange[0].toFixed(0) + '% accuracy');
      item(css('--accent') || '#1c5d99', accRange[1].toFixed(0) + '%');
    } else {
      item('#cfd3d8', '≈1B parameters'); item('#3b5f7d', '≈70B');
    }
  }

  // ── neighbour panel ────────────────────────────────────────────────────
  function drawNb() {
    var m = MS[sel];
    var nm = document.getElementById('at-name');
    nm.innerHTML = '<span class="org">' + orgOf(m.n) + '/</span>' + shortName(m.n);

    var bits = [];
    bits.push('<span class="tag">' + (m.b >= 1 ? m.b + 'B' : m.b) + ' params</span>');
    if (m.s) bits.push('<span class="tag">' + m.s + '</span>');
    bits.push(m.a.toFixed(1) + '% accuracy overall');
    document.getElementById('at-meta').innerHTML = bits.join(' ');

    var P = document.getElementById('at-prof');
    P.textContent = '';
    D.datasets.forEach(function (d) {
      var v = m.p[d];
      var row = document.createElement('div'); row.className = 'at-prow';
      var a = document.createElement('span'); a.className = 'nm'; a.textContent = DSN[d] || d;
      var tr = document.createElement('div'); tr.className = 'tr';
      var fl = document.createElement('div'); fl.className = 'fl';
      fl.style.width = Math.max(0, Math.min(100, v)) + '%';
      fl.style.background = colorOf(m);
      tr.appendChild(fl);
      var pc = document.createElement('span'); pc.className = 'pc'; pc.textContent = v.toFixed(0);
      row.appendChild(a); row.appendChild(tr); row.appendChild(pc);
      P.appendChild(row);
    });

    var O = document.getElementById('at-nblist');
    O.textContent = '';
    m.nb.slice(0, kNb).forEach(function (j, r) {
      var o = MS[j], li = document.createElement('li');
      var w = document.createElement('span'); w.className = 'who';
      w.textContent = shortName(o.n);
      var g = document.createElement('span'); g.className = 'ag';
      g.innerHTML = m.na[r].toFixed(1) + '%<small>d = ' + fmtD(m.nd[r]) + '</small>';
      li.appendChild(w); li.appendChild(g);
      li.style.cursor = 'pointer';
      li.addEventListener('pointerenter', function () { hot = j; drawMap(); });
      li.addEventListener('pointerleave', function () { hot = -1; drawMap(); });
      li.addEventListener('click', function () { sel = j; hot = -1; render(); });
      O.appendChild(li);
    });

    var top = MS[m.nb[0]];
    document.getElementById('at-note').innerHTML =
      'If <b>' + shortName(m.n) + '</b> were unavailable, its closest neighbour <b>' +
      shortName(top.n) + '</b> gives the same verdict on <b>' + m.na[0].toFixed(1) +
      '%</b> of test queries. Across all 112 models that closest-neighbour agreement averages ' +
      '<b>' + (D.kth[0] * 100).toFixed(0) + '%</b>, and it decays gently — the fifth neighbour ' +
      'still agrees ' + (D.kth[4] * 100).toFixed(0) + '% of the time, which is why falling back ' +
      'two or three places costs so little.';
  }

  // ── portfolio panel ────────────────────────────────────────────────────
  function drawPf() {
    var k = D.portfolio.k[pkIdx];
    var full = D.full.h1;
    var rows = [
      { key: 'kcenter',  lab: 'k-center',  c: '#4f9d69' },
      { key: 'kmedoids', lab: 'k-medoids', c: '#d98032' },
      { key: 'random',   lab: 'random subset', c: css('--muted') || '#74787f' }
    ];
    var B = document.getElementById('at-bars');
    B.textContent = '';
    var MAXV = 72;
    rows.forEach(function (r) {
      var row = curveAt(r.key); if (!row) return;
      var d = document.createElement('div'); d.className = 'at-brow';
      var lab = document.createElement('div'); lab.className = 'lab';
      var a = document.createElement('span');
      a.textContent = r.lab + (r.key === rule ? ' ●' : '');
      a.style.fontWeight = r.key === rule ? '650' : '400';
      var b = document.createElement('span'); b.className = 'v';
      b.textContent = row.h1.toFixed(1) + '%' + (r.key === 'random' ? ' ± ' + (row.sd || 0).toFixed(1) : '');
      lab.appendChild(a); lab.appendChild(b);
      var tr = document.createElement('div'); tr.className = 'at-btrack';
      var fl = document.createElement('div'); fl.className = 'at-bfill';
      fl.style.width = (row.h1 / MAXV * 100) + '%';
      fl.style.background = r.c;
      fl.style.opacity = r.key === rule ? '1' : '.5';
      var fu = document.createElement('div'); fu.className = 'at-full';
      fu.style.left = (full / MAXV * 100) + '%';
      tr.appendChild(fl); tr.appendChild(fu);
      d.appendChild(lab); d.appendChild(tr);
      B.appendChild(d);
    });
    var cap = document.createElement('p');
    cap.style.cssText = 'font-size:.72rem;color:var(--muted);margin:.5rem 0 0';
    cap.innerHTML = 'Dashed line: all <b>112</b> models, ' + full.toFixed(1) + '%.';
    B.appendChild(cap);

    var picks = picksNow();
    document.getElementById('at-pfk').textContent = '(' + rule + ', k = ' + k + ')';
    var L = document.getElementById('at-picklist');
    L.textContent = '';
    picks.forEach(function (i) {
      var li = document.createElement('li');
      li.textContent = shortName(MS[i].n);
      li.style.cursor = 'pointer';
      li.addEventListener('pointerenter', function () { hot = i; drawMap(); });
      li.addEventListener('pointerleave', function () { hot = -1; drawMap(); });
      L.appendChild(li);
    });

    var row = curveAt(rule), rnd = curveAt('random');
    var gap = row.h1 - full;
    document.getElementById('at-note').innerHTML =
      'A <b>' + k + '-model</b> portfolio chosen by <b>' + rule + '</b> routes at <b>' +
      row.h1.toFixed(1) + '%</b> — ' +
      (gap >= -0.4
        ? 'matching the full 112-model pool with <b>' + (112 - k) + ' fewer models</b>. '
        : (full - row.h1).toFixed(1) + ' points below the full pool. ') +
      'A random subset of the same size manages ' + rnd.h1.toFixed(1) + '%. ' +
      'The selection uses only the embedding geometry: no candidate subset was ever ' +
      'evaluated on a query.';
  }

  // ── hit testing: nearest point to the pointer ──────────────────────────
  function pick(e) {
    var r = root.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width * VB, py = (e.clientY - r.top) / r.height * VB;
    var best = -1, bd = 1e9;
    for (var i = 0; i < MS.length; i++) {
      var dx = mx(MS[i]) - px, dy = my(MS[i]) - py, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    return bd < 400 ? best : -1;
  }
  root.addEventListener('pointerdown', function (e) {
    if (mode !== 0) return;
    var i = pick(e);
    if (i >= 0) { sel = i; render(); }
  });
  root.addEventListener('pointermove', function (e) {
    if (mode !== 0) return;
    root.style.cursor = pick(e) >= 0 ? 'pointer' : 'crosshair';
  });

  // ── wiring ─────────────────────────────────────────────────────────────
  function setMode(m) {
    mode = m;
    document.getElementById('at-m0').setAttribute('aria-pressed', m === 0);
    document.getElementById('at-m1').setAttribute('aria-pressed', m === 1);
    document.getElementById('at-pane-nb').classList.toggle('at-hide', m !== 0);
    document.getElementById('at-pane-pf').classList.toggle('at-hide', m !== 1);
    document.getElementById('at-ctl-nb').classList.toggle('at-hide', m !== 0);
    document.getElementById('at-ctl-pf').classList.toggle('at-hide', m !== 1);
    render();
  }
  document.getElementById('at-m0').addEventListener('click', function () { setMode(0); });
  document.getElementById('at-m1').addEventListener('click', function () { setMode(1); });

  document.getElementById('at-k').addEventListener('input', function (e) {
    kNb = +e.target.value;
    document.getElementById('at-kval').textContent = kNb;
    render();
  });
  document.getElementById('at-pk').addEventListener('input', function (e) {
    pkIdx = +e.target.value;
    document.getElementById('at-pkval').textContent = D.portfolio.k[pkIdx];
    render();
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-col]'), function (b) {
    b.addEventListener('click', function () {
      colBy = b.dataset.col;
      Array.prototype.forEach.call(document.querySelectorAll('[data-col]'), function (o) {
        o.setAttribute('aria-pressed', o === b);
      });
      render();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-sel]'), function (b) {
    b.addEventListener('click', function () {
      rule = b.dataset.sel;
      Array.prototype.forEach.call(document.querySelectorAll('[data-sel]'), function (o) {
        o.setAttribute('aria-pressed', o === b);
      });
      render();
    });
  });
  document.getElementById('at-cover').addEventListener('click', function () {
    showCover = !showCover;
    this.setAttribute('aria-pressed', showCover);
    render();
  });
  Array.prototype.forEach.call(document.querySelectorAll('.at-jump'), function (b) {
    b.addEventListener('click', function () {
      var q = b.dataset.q.toLowerCase();
      for (var i = 0; i < MS.length; i++) {
        if (MS[i].n.toLowerCase().indexOf(q) >= 0) { sel = i; break; }
      }
      if (mode !== 0) setMode(0); else render();
    });
  });

  function render() { drawMap(); drawLegend(); if (mode === 0) drawNb(); else drawPf(); }

  document.getElementById('at-src').innerHTML =
    'Every number here is measured, not illustrative. Embeddings are recomputed from the ' +
    'released LOCUS checkpoint over 4,096 evaluations per model; neighbours and distances ' +
    'are cosine distances in the full <b>128</b> dimensions, and agreement is the fraction of ' +
    '3,000 held-out test queries on which two models’ correctness labels match. Portfolio ' +
    'accuracies and selections are the paper’s own, on the same test split. The 2-D layout is ' +
    't-SNE on the cosine distances and is the only approximation on this figure — it preserves ' +
    '<b>84%</b> of each model’s true ten nearest neighbours, so read positions as a guide and ' +
    'the listed distances as the truth.';

  // start somewhere interesting: the math specialist
  for (var i = 0; i < MS.length; i++) if (MS[i].n.indexOf('deepseek-math') >= 0) { sel = i; break; }
  document.getElementById('at-pkval').textContent = D.portfolio.k[pkIdx];
  render();
  new MutationObserver(function () { render(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
