      flatshading: true, hoverinfo: 'skip',
      lighting: { ambient: 0.72, diffuse: 0.85, specular: 0.06, roughness: 0.9 },
      colorbar: {
        title: { text: '%', font: { size: 12 } },
        thickness: 11, len: 0.6, tickfont: { size: 11 }, outlinewidth: 0
      }
    },
    {
      type: 'scatter3d', mode: 'markers',
      x: D.hx, y: D.hy, z: D.hz,
      marker: { size: 4, opacity: 0 },
      text: D.ht, hovertemplate: '%{text}<extra></extra>'
    }
  ];

  el.innerHTML = '';
  Plotly.newPlot(el, data, layout(), {
    displayModeBar: false, responsive: true, scrollZoom: true
  });

  new MutationObserver(function () { Plotly.relayout(el, layout()); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
