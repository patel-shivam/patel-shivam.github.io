# ─── Site ─────────────────────────────────────────────────────────────
title: Shivam Patel
tagline: PhD Student, Electrical & Computer Engineering, Carnegie Mellon University
description: >-
  Shivam Patel is a PhD student in Electrical and Computer Engineering at
  Carnegie Mellon University, advised by Prof. Gauri Joshi. He works on
  efficient and low-latency LLM inference, and on systems–algorithm
  co-design for inference optimization.

url: "https://patel-shivam.github.io"
baseurl: ""

# ─── Author / contact ─────────────────────────────────────────────────
author:
  name: Shivam Patel
  role: PhD Student
  department: Electrical & Computer Engineering
  affiliation: Carnegie Mellon University
  affiliation_url: https://www.ece.cmu.edu
  email: shivamap [at] andrew [dot] cmu [dot] edu
  photo: /assets/img/social-card.jpg

links:
  - name: Email
    url: "mailto:shivamap@andrew.cmu.edu"
  - name: Google Scholar
    url: "https://scholar.google.co.in/citations?user=-842QRIAAAAJ&hl=en"
  - name: CV
    url: "/files/CV_current.pdf"

nav:
  - name: About
    url: /
  - name: Publications
    url: /publications
  - name: CV
    url: /cv

# ─── Build ────────────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /:title

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# jekyll-seo-tag reads page.image (not site.image), so inject it everywhere.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/social-card.jpg

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - LICENSE
  - vendor/
  - photos-inbox/
  - tools/
  - "papers/**/*.part.html"   # page partials: included, never served alone
  - .jekyll-cache/
