<p class="contact">
  <button type="button" class="email-btn" id="email-btn">
    {%- include icon.html name="mail" -%}
    <span id="email-text">shivamap [at] andrew [dot] cmu [dot] edu</span>
  </button>
</p>
<script>
  (function () {
    var btn = document.getElementById('email-btn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      // assembled at click time, so scrapers reading the static page find nothing
      var addr = ['shivamap', 'andrew.cmu.edu'].join('@');
      var a = document.createElement('a');
      a.className = 'email-btn revealed';
      a.href = 'mailto:' + addr;
      a.innerHTML = btn.querySelector('svg').outerHTML + '<span>' + addr + '</span>';
      btn.replaceWith(a);
    });
  })();
</script>
